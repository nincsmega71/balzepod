name: APK fordítás

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Android SDK licencek
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: APK fordítása
        run: gradle :app:assembleDebug --stacktrace

      - name: APK átnevezése
        run: cp app/build/outputs/apk/debug/app-debug.apk BlazePodVezerlo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BlazePodVezerlo-apk
          path: BlazePodVezerlo.apk

      - name: Release közzététele
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: BlazePod Vezérlő – build ${{ github.run_number }}
          body: Töltsd le a BlazePodVezerlo.apk fájlt a telefonra, és telepítsd.
          files: BlazePodVezerlo.apk
          make_latest: true
